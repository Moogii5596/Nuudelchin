<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Нүүдэлчин — Зуслан</title>
    <meta name="description" content="Монгол нүүдэлчин малчны амьдралыг харуулсан 3D тоглоом" />
    <meta name="theme-color" content="#2b1d14" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Утсанд «Нүүр дэлгэцэд нэмэх»-ээр апп шиг бүтэн дэлгэцээр нээгдэнэ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Нүүдэлчин" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc4f0; font-family: "Noto Sans", "Noto Sans Mongolian", system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { outline: none; display: block; }
      #app::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
                   background: radial-gradient(ellipse at center, transparent 56%, rgba(32, 24, 28, 0.32) 100%); }
      #app[data-quality="mid"]::after { opacity: 0.1; }
      #app[data-quality="high"]::after { opacity: 0.16; }
      body.photo-mode #hud, body.photo-mode #perf, body.photo-mode #help, body.photo-mode #prompt, body.photo-mode #toasts { display: none !important; }
      body.photo-mode .joy, body.photo-mode .acts, body.photo-mode .tmenu, body.photo-mode .tpop { display: none !important; }
      #sceneFade { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: rgba(32, 24, 28, 0.42); opacity: 0; }
      #sceneFade.play { animation: scene-fade 420ms ease-out both; }
      @keyframes scene-fade { 0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #sceneFade.play { animation: none; } }
      .panel { position: fixed; padding: 10px 14px; border: 1px solid rgba(232, 182, 76, 0.34); border-radius: 10px; background: rgba(30, 24, 18, 0.72);
               color: #f4ead6; font-size: 14px; line-height: 1.5; pointer-events: none; box-shadow: 0 6px 24px rgba(30, 20, 12, 0.14); }
      #hud { top: 12px; left: 12px; }
      #hud b { color: #e8b64c; }
      /* 📜 Тэмдэглэл: HUD-ийн баруун талд (байрлалыг main.ts тавина), уншаагүйн улаан тоо */
      #logBtn { position: fixed; top: 12px; left: 12px; z-index: 6; }
      body.touch #logBtn { top: max(6px, env(safe-area-inset-top)); }
      body.photo-mode #logBtn { display: none !important; }
      #logBtn i { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #d9342b; color: #fff;
                  font: 700 11px/18px system-ui, sans-serif; text-align: center; }
      #logBtn i:empty { display: none; }
      #modalBox .logtabs { display: flex; gap: 8px; margin: 0 0 10px; }
      #modalBox .logtabs .btn { min-height: 44px; padding: 0 16px; }
      #modalBox .lognav { display: flex; align-items: center; gap: 10px; }
      #modalBox .lognav .btn { min-width: 44px; min-height: 44px; font-size: 18px; }
      #modalBox .logwhen { white-space: nowrap; width: 1%; }
      #perf { top: 62px; right: 12px; font: 12px ui-monospace, monospace; white-space: pre-line; }
      #help { left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: pre-line; max-width: 620px; display: none; font-size: 15px; }
      #help h3 { margin: 0 0 6px; color: #e8b64c; }
      #toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
      .toast { padding: 7px 14px; border-radius: 8px; background: rgba(30, 24, 18, 0.82); color: #f4ead6; font-size: 14px; }
      .toast.good { border-left: 4px solid #7bbf5a; }
      .toast.bad { border-left: 4px solid #d9534f; }
      #prompt { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 8px;
                background: rgba(30, 24, 18, 0.78); color: #f4ead6; font-size: 15px; pointer-events: none; display: none; }
      #prompt kbd { background: #e8b64c; color: #2b1d14; border-radius: 4px; padding: 0 6px; font-weight: 700; }
      #modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(20, 14, 8, 0.45); }
      #modalBox { width: min(760px, 94vw); max-height: 88vh; overflow: auto; padding: 18px 22px; border-radius: 12px;
                  background: #f6efe1; color: #2b1d14; font-size: 14px; line-height: 1.45; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
      #modalBox h2 { margin: 0 0 10px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
      #modalBox h3 { margin: 16px 0 6px; font-size: 15px; color: #6b3d1e; }
      #modalBox table { width: 100%; border-collapse: collapse; }
      #modalBox td { padding: 4px 6px; border-bottom: 1px solid #e4d8c0; vertical-align: middle; }
      #modalBox tr.total td { border-top: 2px solid #6b3d1e; font-weight: 700; }
      #modalBox .num { text-align: right; white-space: nowrap; }
      #modalBox .ctl { text-align: right; white-space: nowrap; }
      #modalBox .ctl b { display: inline-block; min-width: 34px; text-align: center; }
      #modalBox .muted { color: #8a7a60; font-size: 13px; }
      #modalBox .good { color: #3d7a2a; }
      #modalBox .bad { color: #b03a2e; }
      #modalBox .close { cursor: pointer; font-size: 18px; color: #8a7a60; }
      #modalBox .bar { height: 8px; background: #e4d8c0; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
      #modalBox .bar div { height: 100%; background: #c98a2e; }
      #modalBox .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      #modalBox .sum { display: flex; gap: 22px; margin: 12px 0 4px; padding: 8px 10px; background: #efe3cb; border-radius: 8px; }
      .btn { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid #b59a6a; background: #fffaf0; color: #2b1d14; cursor: pointer; }
      .btn:hover:not([disabled]) { background: #f3e6c8; }
      .btn[disabled] { opacity: 0.45; cursor: default; }
      .btn.gold { background: #e8b64c; border-color: #b8862c; font-weight: 600; }
      .btn.sm { padding: 0 8px; }
      .btn.big { padding: 7px 22px; font-size: 15px; }
      #err { position: fixed; inset: 0; display: none; place-items: center; background: #2b1d14; color: #f4ead6; padding: 24px; white-space: pre-wrap; }

      /* ===================== Утас (body.touch — input/touch.ts) ===================== */
      body.touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body.touch #app canvas { touch-action: none; }
      body.touch #perf { top: max(6px, env(safe-area-inset-top)); right: auto; left: 50%; transform: translateX(-50%); padding: 4px 8px; font-size: 10.5px; text-align: center; }
      body.touch #hud { top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); padding: 5px 9px; font-size: 11.5px; line-height: 1.4;
                        max-width: 52vw; max-height: 62vh; overflow: hidden; pointer-events: auto; }
      body.touch #hud small { font-size: 10px; opacity: 0.8; }
      body.touch #help { z-index: 30; background: rgba(30, 24, 18, 0.95); pointer-events: auto; font-size: 12.5px; line-height: 1.45; width: min(92vw, 760px); max-width: none; max-height: 86vh; max-height: 86dvh; overflow: auto; }
      body.touch #help .hclose { float: right; font-size: 26px; line-height: 1; padding: 0 4px 8px 12px; cursor: pointer; }
      body.touch #help .hbtns { margin: 10px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
      body.touch #toasts { bottom: max(8px, env(safe-area-inset-bottom)); max-width: 44vw; width: 44vw; }
      body.touch .toast { font-size: 12px; padding: 5px 10px; text-align: center; }
      /* Утсанд зааврын мөр мэдэгдлүүдийн доор нэг багананд (давхцахгүй) */
      body.touch #prompt { position: static; transform: none; max-width: 44vw; font-size: 12px; padding: 4px 10px; text-align: center; }
      kbd { font-family: inherit; }
      body.touch #modalBox { width: 96vw; max-height: 94vh; max-height: 94dvh; padding: 10px 14px; font-size: 13px; -webkit-overflow-scrolling: touch; }
      body.touch #modalBox h2 { font-size: 17px; position: sticky; top: -10px; background: #f6efe1; padding: 4px 0; z-index: 1; }
      body.touch #modalBox .close { font-size: 26px; padding: 0 6px; }
      body.touch #modalBox td { padding: 5px 4px; }
      body.touch .btn { padding: 7px 12px; min-height: 34px; touch-action: manipulation; }
      body.touch .btn.sm { min-width: 34px; padding: 4px 8px; }
      @media (max-width: 640px) { body.touch #modalBox .cols { grid-template-columns: 1fr; } }

      .joy { position: fixed; left: max(22px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%;
             background: rgba(30, 24, 18, 0.28); border: 2px solid rgba(244, 234, 214, 0.45); touch-action: none; z-index: 5; }
      .joy .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
                   background: rgba(244, 234, 214, 0.78); box-shadow: 0 2px 8px rgba(0,0,0,0.3); pointer-events: none; }
      .acts { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap-reverse;
              justify-content: flex-end; gap: 8px; width: 260px; z-index: 5; }
      /* Цагийн мөр (хурд, алгасах) — утас, компьютер хоёуланд; утсанд ⛶, ☰ нэмэгдэнэ (render/ui/timebar.ts) */
      .tmenu { position: fixed; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); display: flex; flex-wrap: nowrap; justify-content: flex-end;
               gap: 6px; z-index: 6; }
      .tpop { position: fixed; top: calc(max(6px, env(safe-area-inset-top)) + 50px); right: max(6px, env(safe-area-inset-right)); display: none; gap: 6px; padding: 6px;
              border-radius: 14px; background: rgba(30, 24, 18, 0.92); border: 1px solid rgba(232, 182, 76, 0.4); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); z-index: 7;
              max-height: calc(100vh - 64px); max-height: calc(100dvh - 64px); overflow: auto; }
      .tpop.open.row { display: flex; }
      .tpop.open.col { display: flex; flex-direction: column; }
      .tpop.open.grid { display: grid; grid-template-columns: 1fr 1fr; }
      .tbtn.item { display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 150px; padding: 0 12px; font-size: 14px; text-align: left; border-radius: 10px; white-space: nowrap; }
      .tbtn.item span { font-size: 20px; width: 24px; text-align: center; }
      .tbtn.item[disabled] { opacity: 0.4; }
      .tbtn.cur { background: #e8b64c; color: #2b1d14; border-color: #fff3d0; font-weight: 700; }
      .skipfade { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(14, 10, 22, 0.4); touch-action: none; }
      .skipfade.open { display: flex; }
      .skipbox { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #f4ead6; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
      .skipclock { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
      .skiplbl { font-size: 15px; opacity: 0.9; }
      .tbtn.skipstop { min-width: 150px; height: 48px; font-size: 17px; margin-top: 6px; touch-action: manipulation; }
      .tbtn { font: inherit; border: 2px solid rgba(244, 234, 214, 0.5); background: rgba(30, 24, 18, 0.62); color: #f4ead6; border-radius: 14px;
              touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
      .tbtn.act { width: 58px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
      .tbtn.act { min-width: 58px; width: auto; padding: 0 5px; box-sizing: border-box; }   /* урт шошго (Боловсруулах) багтана */
      .tbtn.act span { font-size: 24px; line-height: 1; }
      .tbtn.act small { font-size: 9.5px; margin-top: 2px; opacity: 0.9; }
      .tbtn.sm { min-width: 44px; height: 44px; font-size: 19px; padding: 0 6px; border-radius: 10px; touch-action: manipulation; }
      .tbtn.act.prime { min-width: 70px; height: 70px; border-color: #e8b64c; background: rgba(120, 78, 12, 0.82); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.35), 0 4px 14px rgba(0, 0, 0, 0.35); }
      .tbtn.act.prime span { font-size: 29px; }
      .tbtn.act.prime small { font-size: 10.5px; font-weight: 700; opacity: 1; }
      .tbtn.on { background: rgba(232, 182, 76, 0.85); color: #2b1d14; }
      .rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; background: #2b1d14; color: #f4ead6;
                font-size: 17px; z-index: 50; padding: 20px; }
      .rot-box { max-width: 420px; }
      .rot-ico { font-size: 54px; margin-bottom: 6px; }
      .rot-msg { margin-bottom: 18px; }
      .rot-btns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin: 12px 0 10px; }
      .tstart .rot-btns { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .rot-hint { font-size: 14px; opacity: 0.75; }
      .rot-note { margin-top: 16px; font-size: 13px; opacity: 0.85; line-height: 1.45; }
      .rotate .btn.big { padding: 12px 20px; font-size: 16px; }
      .tsheet { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 14, 8, 0.75); z-index: 60; }
      .tsheet ol { margin: 10px 0; padding-left: 20px; line-height: 1.7; }
      .ios-share { display: inline-block; padding: 0 6px; border: 1.5px solid #2b7be4; border-radius: 6px; color: #2b7be4; font-weight: 700; }
      .muted { color: #8a7a60; font-size: 13px; }
      .tstart { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 14, 8, 0.6); z-index: 40; }
      .tstart-box { width: min(560px, 90vw); max-height: 90vh; max-height: 90dvh; overflow: auto; padding: 14px 20px; border-radius: 14px; background: #f6efe1; color: #2b1d14; font-size: 13.5px; }
      .tstart-box h1 { margin: 0 0 4px; font-size: 24px; color: #6b3d1e; }
      .tstart-box ul { margin: 8px 0 12px; padding-left: 4px; list-style: none; line-height: 1.6; }
      .tstart-box p { margin: 0; }
      @media (max-height: 420px) { .joy { width: 112px; height: 112px; } .tbtn.act { min-width: 52px; height: 52px; } .tbtn.act span { font-size: 21px; } .tbtn.act.prime { min-width: 62px; height: 62px; } .acts { width: 236px; gap: 6px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="sceneFade"></div>
    <div id="hud" class="panel"></div>
    <button id="logBtn" class="tbtn sm">📜<i></i></button>
    <div id="perf" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="prompt"></div>
    <div id="toasts"></div>
    <div id="modal"><div id="modalBox"></div></div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
