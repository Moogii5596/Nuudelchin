<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2a2017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>UI lab — HUD 2</title>
    <!-- T-27: утасны HUD 2-ын туршилт (хэвтээ утас). Код: src/ui-lab/. Тоглоомын цонхны загвар index.html-ээс ачаалагдана (src/ui-lab/main.ts adoptGameStyles) -->
    <style>
      :root { --bg: rgba(42, 32, 23, 0.86); --bg2: #2a2017; --gold: #e8b84a; --ink: #f3e7cf; --line: rgba(232, 184, 74, 0.55);
              --sl: max(48px, env(safe-area-inset-left)); --sr: max(48px, env(safe-area-inset-right));
              --st: max(8px, env(safe-area-inset-top)); --sb: max(12px, env(safe-area-inset-bottom)); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc4f0; overscroll-behavior: none; }
      body.lab #toasts { bottom: auto; top: calc(var(--st) + 52px); max-width: 46vw; width: auto; }
      body.lab #perf { top: calc(var(--st) + 50px); left: var(--sl); right: auto; transform: none; }
      .l-hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; color: var(--ink); font: 13px/1.3 "Noto Sans", system-ui, sans-serif;
               -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      .l-hud.hide > :not(.l-rotate) { display: none !important; }
      .l-hud button { font: inherit; color: inherit; margin: 0; touch-action: none; cursor: pointer; }
      .l-hud.wheeling :is(.l-gold, .l-horse, .l-map, .l-list, .l-marks) { visibility: hidden; }
      .l-hud.wheeling .l-act { opacity: 0; }
      .l-ic { display: block; flex: none; }

      /* Дээд: нэг мөр төлөв */
      .l-top { position: absolute; top: var(--st); left: var(--sl); pointer-events: auto; }
      .l-status { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
      .l-status span { display: inline-flex; align-items: center; gap: 5px; }
      .l-status b { color: var(--gold); font-weight: 700; }
      .l-detail { position: absolute; top: calc(var(--st) + 50px); left: var(--sl); display: none; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
                  line-height: 1.6; max-width: 62vw; }
      .l-detail.open { display: block; }
      .l-tr { position: absolute; top: var(--st); right: var(--sr); display: flex; gap: 8px; pointer-events: auto; }

      /* Товчны суурь */
      .l-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
               pointer-events: auto; transition: transform 80ms, background 80ms; }
      .l-btn small { font-size: 10px; line-height: 1.1; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .l-btn.on { transform: scale(0.94); background: rgba(72, 54, 36, 0.95); }
      .l-btn.off { opacity: 0.38; }
      .l-sm { width: 44px; height: 44px; font-weight: 700; font-size: 14px; }

      /* Баруун доод: эрхий хурууны 4 тогтмол байрлал */
      .l-gold { position: absolute; right: var(--sr); bottom: calc(var(--sb) + 4px); width: 82px; height: 82px; background: var(--gold); color: var(--bg2); border-color: #fff1c9;
                box-shadow: 0 4px 18px rgba(20, 12, 4, 0.45); }
      .l-gold small { font-size: 11px; font-weight: 700; }
      .l-gold.on { background: #f5cd6c; }
      .l-gold.off { background: var(--bg); color: var(--ink); border-color: var(--line); box-shadow: none; opacity: 0.45; }
      .l-horse { position: absolute; right: calc(var(--sr) + 96px); bottom: var(--sb); width: 62px; height: 62px; }
      .l-act { position: absolute; right: calc(var(--sr) + 76px); bottom: calc(var(--sb) + 74px); width: 62px; height: 62px; }
      .l-map { position: absolute; right: calc(var(--sr) + 4px); bottom: calc(var(--sb) + 100px); width: 54px; height: 54px; }
      .l-act i { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #c9432f; color: #fff;
                 font: 700 11px/18px system-ui, sans-serif; text-align: center; }
      .l-act i:empty { display: none; }

      /* Ойр 2+ зүйл: жагсаалт */
      .l-list { position: absolute; right: calc(var(--sr) + 170px); bottom: var(--sb); display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: auto; }
      .l-row { display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 132px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--bg); white-space: nowrap; }
      .l-row.sel { border-color: var(--gold); color: var(--gold); font-weight: 700; }
      .l-row.on { background: rgba(72, 54, 36, 0.95); }

      /* Объект дээрх тэмдэг */
      .l-marks { position: absolute; inset: 0; overflow: hidden; }
      .l-mark { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .l-mark i { position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; background: rgba(42, 32, 23, 0.55); opacity: 0.8; }
      .l-mark.sel i { left: -10px; top: -10px; width: 14px; height: 14px; border: 3px solid var(--gold); opacity: 1; box-shadow: 0 0 0 3px rgba(232, 184, 74, 0.28); }

      /* Джойстик */
      .l-joyzone { position: absolute; left: 0; bottom: 0; width: 42vw; height: 66vh; touch-action: none; pointer-events: auto; }
      .l-joy { position: absolute; left: calc(var(--sl) + 6px); bottom: calc(var(--sb) + 8px); width: 112px; height: 112px; border-radius: 50%; border: 1.5px solid var(--line);
               background: rgba(42, 32, 23, 0.32); opacity: 0.6; }
      .l-joy.live { opacity: 1; }
      .l-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(232, 184, 74, 0.85); }

      /* Actions дугуй */
      .l-wheel { position: absolute; inset: 0; display: none; background: rgba(20, 14, 8, 0.38); pointer-events: auto; touch-action: none; }
      .l-wheel.open { display: block; }
      .l-ring { position: absolute; right: calc(var(--sr) + 150px); bottom: calc(var(--sb) + 150px); width: 0; height: 0; }
      .l-ring::before { content: ""; position: absolute; left: -134px; top: -134px; width: 268px; height: 268px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line); box-sizing: border-box; }
      .l-hubtxt { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 50%;
                  border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--gold); }
      .l-witem { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0;
                 border-radius: 50%; border: 1.5px solid transparent; background: transparent; }
      .l-witem small { font-size: 10px; white-space: nowrap; }
      .l-witem.hot, .l-witem:active { background: var(--gold); color: var(--bg2); border-color: #fff1c9; }

      /* Жижиг цэс (алгасах, ☰) */
      .l-pop { position: absolute; top: calc(var(--st) + 52px); right: var(--sr); display: none; flex-direction: column; gap: 6px; padding: 8px; border-radius: 14px; border: 1px solid var(--line);
               background: var(--bg); pointer-events: auto; }
      .l-pop.open { display: flex; }
      .l-pop.l-grid.open { display: grid; grid-template-columns: 1fr 1fr; }
      .l-item { display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 136px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(232, 184, 74, 0.25);
                background: rgba(255, 255, 255, 0.04); white-space: nowrap; text-align: left; }
      .l-item.off { opacity: 0.4; }
      .l-scenes { grid-column: 1 / -1; display: flex; gap: 6px; padding-top: 4px; border-top: 1px solid rgba(232, 184, 74, 0.25); }
      .l-chip { flex: 1; min-height: 44px; padding: 0 10px; border-radius: 22px; border: 1px solid var(--line); background: transparent; }

      .l-skip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; flex-direction: column; align-items: center; gap: 10px; padding: 16px 26px;
                border-radius: 16px; border: 1px solid var(--line); background: var(--bg); pointer-events: auto; }
      .l-skip.open { display: flex; }
      .l-skip b { font-size: 26px; color: var(--gold); }
      .l-rotate { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg2); color: var(--gold);
                  font-size: 16px; text-align: center; pointer-events: auto; }
      .l-rotate.open { display: flex; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="sceneFade"></div>
    <div id="perf" class="panel"></div>
    <div id="toasts"></div>
    <div id="floats"></div>
    <div id="modal"><div id="modalBox"></div></div>
    <div id="err"></div>
    <script type="module" src="/src/ui-lab/main.ts"></script>
  </body>
</html>
