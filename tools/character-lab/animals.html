{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
 * Хэв маяг: render/character/ (малчин)-тай ижил хэл — гөлгөр Lambert, эргэлтийн биет (Lathe),
 * цилиндр толгой + нүүр, текстургүй цэвэр өнгө.
 * Хоёр түвшин:
 *   Дэлгэрэнгүй — canvas-ээр зурсан нүүр, олон mesh (ойрын зураг).
 *   Хөнгөн      — ≤ 750 гурвалжин, төрөл бүрт цөөн InstancedMesh (бие+сүүл · хүзүү · толгой+чих+нүд · 4 хөл), нэг материал,
 *                 нүүр нь оройн өнгө (vertex color), өнгө нь instanceColor (render/animals.ts-ийн бүтэцтэй ижил).
 * ===================================================================== */
const INK = '#22160f';
const css = (c) => '#' + c.toString(16).padStart(6, '0');
const mix = (a, b, k) => { const ch = (s) => Math.round(((a >> s) & 255) * (1 - k) + ((b >> s) & 255) * k) << s; return ch(16) | ch(8) | ch(0); };
const lam = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
const rnd = (a, b) => a + Math.random() * (b - a);
const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function profile(ctrl, rows) {
  const curve = new THREE.SplineCurve(ctrl.map(([r, y]) => new THREE.Vector2(r, y)));
  return curve.getPoints(rows).map((p) => new THREE.Vector2(Math.max(0, p.x), p.y));
}
function ellipsoid(rx, ry, rz, pos = [0, 0, 0], w = 24, h = 16) {
  const g = new THREE.SphereGeometry(1, w, h);
  const p = g.attributes.position, n = g.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const v = new THREE.Vector3(x / rx, y / ry, z / rz).normalize();
    n.setXYZ(i, v.x, v.y, v.z);
    p.setXYZ(i, x * rx + pos[0], y * ry + pos[1], z * rz + pos[2]);
  }
  return g;
}
const rotZ = (g, a) => { g.applyMatrix4(new THREE.Matrix4().makeRotationZ(a)); return g; };
const mesh = (geo, mat, parent, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
};
function group(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const triOf = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;

/* ---------- Хонины хэсгүүд (дэлгэрэнгүй ба хөнгөн хоёулаа хэрэглэнэ; seg/rows параметртэй) ---------- */
/** Бие: нэг цэвэр торх (superellipse профайлтай lathe, урт нь z тэнхлэгт) */
function bodyGeo({ L, R, wide, p, sag = 0, crest = null }, seg = 44, rows = 44) {
  const pts = [];
  for (let i = 0; i <= rows; i++) {
    const t = -Math.cos(Math.PI * i / rows);       // үзүүр рүү нягт
    pts.push(new THREE.Vector2(R * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), p)), 1 / p), t * L / 2));
  }
  const g = new THREE.LatheGeometry(pts, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  const pos = g.attributes.position, an = [];
  for (let i = 0; i < pos.count; i++) {
    { // шинжилгээний гөлгөр нормал (superellipsoid-ийн градиент) — цөөн хуваалттай ч бөөрөнхий харагдана
      const X = pos.getX(i), Y = pos.getY(i), Z = pos.getZ(i), r = Math.hypot(X, Y) || 1e-6, a = r / R, u = Z / (L / 2);
      const k = Math.pow(a, p - 1) / R, nx = k * (X / r) / wide, ny = k * (Y / r), nz = Math.sign(u) * Math.pow(Math.abs(u), p - 1) / (L / 2);
      const m = Math.hypot(nx, ny, nz) || 1; an.push(nx / m, ny / m, nz / m);
    }
    pos.setX(i, pos.getX(i) * wide);
    if (sag) { const y = pos.getY(i), u = pos.getZ(i) / (L / 2); if (y > 0) pos.setY(i, y - sag * (1 - u * u) * (y / R)); }   // хөгшин: нуруу бага зэрэг хонхойно
  }
  g.setAttribute('normal', new THREE.Float32BufferAttribute(an, 3));
  if (!crest) return g;
  /* Бухын мөр: нурууны урд хагас (мөр, сэрвээ) дээш өргөгдөж хажуу тийш өргөсөнө — биетэйгээ нэг гөлгөр гадаргуу.
   * crest.h — өргөлт (м), wide — өргөсөлт (харьцаа), zm/zw — уртын дагуух төв ба тархалт (−1 хойд … 1 урд) */
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), u = pos.getZ(i) / (L / 2), w = Math.exp(-(((u - crest.zm) / crest.zw) ** 2)), top = Math.max(0, y / R);
    pos.setY(i, y + crest.h * w * Math.pow(top, 1.3));
    pos.setX(i, x * (1 + crest.wide * w * (0.35 + 0.65 * top)));
  }
  g.deleteAttribute('uv');
  const mg = mergeVertices(g);
  mg.computeVertexNormals();
  return mg;
}
/** Хүзүү: богино бүдүүн хоолой (+z руу), урт нь len; xk — хажуу тийш нарийсгах (адуу) */
const NECK_PROF = [[0.12, -0.02], [0.125, 0.05], [0.104, 0.17], [0.082, 0.27]];
const neckCurve = (len, rk) => new THREE.SplineCurve(NECK_PROF.map(([r, y]) => new THREE.Vector2(r * rk, y * (len / 0.26))));
function neckGeo(len, seg = 24, rows = 5, rk = 1, xk = 1) {
  const g = new THREE.LatheGeometry(neckCurve(len, rk).getPoints(rows), seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  if (xk !== 1) g.scale(xk, 1, 1);
  g.computeVertexNormals();
  return g;
}
/** Хоёр талтай хавтан (нэг материалд): урд, ар нүүрийг тусад нь (нормал эсрэг) */
function twoFaced(pos, idx) {
  const n = pos.length / 3, g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([...pos, ...pos], 3));
  const back = []; for (let i = 0; i < idx.length; i += 3) back.push(idx[i] + n, idx[i + 2] + n, idx[i + 1] + n);
  g.setIndex([...idx, ...back]); g.computeVertexNormals();
  return g;
}
/** Дэл: хүзүүний орой дагуу (хүзүүний локал координат), нэг тал руу унжсан урт үс, үзүүр нь шүдлэг. mk — урт/өтгөний харьцаа (азарга) */
function maneGeo(d, rk, mk, NZ, NJ) {
  const M = d.mane, xk = d.neckX ?? 1, pts = neckCurve(d.neckLen, rk).getPoints(40), zEnd = pts[pts.length - 1].y;
  const rAt = (z) => { for (let i = 1; i < pts.length; i++) if (pts[i].y >= z) { const a = pts[i - 1], b = pts[i], t = (z - a.y) / ((b.y - a.y) || 1); return a.x + (b.x - a.x) * t; } return pts[pts.length - 1].x; };
  const pos = [], idx = [];
  for (let i = 0; i <= NZ; i++) {
    const t = i / NZ, z = zEnd * (M.z0 + (M.z1 - M.z0) * t), r = rAt(z);
    const dep = M.depth * mk * (0.7 + 0.3 * Math.sin(Math.PI * t)) * (i % 2 ? 1 : 0.8), aEnd = Math.min(1.9, dep / r);   // шүдлэг үзүүр
    for (let j = 0; j <= NJ; j++) {
      const u = j / NJ, a = -0.35 + (aEnd + 0.35) * u, rad = r + 0.006 + M.lift * mk * Math.sin(Math.PI * Math.min(1, u * 1.25));
      pos.push(-Math.sin(a) * rad * xk, Math.cos(a) * rad, z);   // −x тал руу (хажуу харагдацад харагдана)
    }
  }
  for (let i = 0; i < NZ; i++) for (let j = 0; j < NJ; j++) { const a = i * (NJ + 1) + j, b = a + 1, c = a + NJ + 1, e = c + 1; idx.push(a, b, c, b, e, c); }
  return twoFaced(pos, idx);
}
/** Адууны сүүл: өтгөн урт үс, үзүүрээ нарийссан (pivot = дээд, доош унжина) */
function horseTailGeo(T, seg, lite) {
  const L = T.len, r = T.r;
  const pts = (lite ? [[r * 0.7, 0], [r * 1.3, -L * 0.45], [r * 1.1, -L * 0.85], [0, -L]]
    : [[0, 0.01], [r * 0.7, -0.01], [r * 0.9, -0.1], [r * 1.25, -L * 0.4], [r * 1.35, -L * 0.7], [r * 0.95, -L * 0.92], [0, -L]]).map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, seg); g.scale(0.72, 1, 1); g.computeVertexNormals(); return g;
}
/** Хоёр цэгийн хооронд нарийссан хоолой */
function limbBetween(a, b, r0, r1, mat, parent, seg = 12) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), v = B.clone().sub(A);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, v.length(), seg), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.normalize()); m.castShadow = true;
  parent.add(m); return m;
}
/** Монгол эмээл (эмээлийн төв дэх нурууны орой = эх цэг): тохом (хөх, улаан эсгий), модон бүүрэг (өндөр урд, хойд бүүрэг),
 * мөнгөн товруу, олом, дөрөө. Буцаах: { group, seat — суудлын оройн өндөр, stir — дөрөөний ул, side — хажуугийн зай } */
function makeSaddle(d) {
  const g = new THREE.Group(), R = d.body.R, W = d.body.wide, C = LAB.saddle;
  const sheet = (a0, a1, z0, z1, off, color) => {
    const pos = [], idx = [], nA = 12, nZ = 4;
    for (let i = 0; i <= nA; i++) for (let j = 0; j <= nZ; j++) { const a = a0 + (a1 - a0) * i / nA, z = z0 + (z1 - z0) * j / nZ; pos.push(Math.sin(a) * (R * W + off), Math.cos(a) * (R + off) - R, z); }
    for (let i = 0; i < nA; i++) for (let j = 0; j < nZ; j++) { const a = i * (nZ + 1) + j, b = a + 1, c = a + nZ + 1, e = c + 1; idx.push(a, c, b, b, c, e); }
    mesh(twoFaced(pos, idx), lam(color), g);
  };
  sheet(-1.15, 1.15, -0.3, 0.3, 0.012, C.felt);            // доод тохом
  sheet(-0.95, 0.95, -0.24, 0.24, 0.022, C.pad);           // дээд эсгий
  const wood = lam(C.wood), metal = lam(C.metal);
  mesh(ellipsoid(0.13, 0.035, 0.16, [0, 0.05, 0], 18, 10), lam(C.seat), g);                     // суудал
  mesh(ellipsoid(0.12, 0.1, 0.032, [0, 0.11, 0.17], 18, 10), wood, g);                          // урд бүүрэг (өндөр)
  mesh(ellipsoid(0.12, 0.08, 0.032, [0, 0.09, -0.16], 18, 10), wood, g);                        // хойд бүүрэг
  for (const x of [-0.06, 0, 0.06]) mesh(ellipsoid(0.018, 0.018, 0.01, [x, 0.13 - Math.abs(x) * 0.4, 0.2], 8, 6), metal, g);   // товруу
  const girth = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 36), lam(C.strap));          // олом (гэдэс тойрсон)
  girth.scale.set(R * W + 0.016, R + 0.016, 1); girth.position.set(0, -R, 0.02); g.add(girth);
  const side = R * W + 0.035, drop = d.saddle.drop;
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.008, drop, 0.03), lam(C.strap), g, sx * side, -drop / 2 + 0.02, 0.03);                  // дөрөөний оосор
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.01, 6, 16), metal); ring.position.set(sx * side, -drop - 0.035, 0.03); g.add(ring);   // дөрөө
    mesh(new THREE.BoxGeometry(0.05, 0.012, 0.09), metal, g, sx * side, -drop - 0.085, 0.03);
  }
  return { group: g, seat: 0.085, stir: -drop - 0.085, side };
}
/** Морины хазаар: хамрын оосор, хацрын оосор, жолоо (толгойн локал, хазайлтын group-д) */
function bridleGeo(h, q) {
  const parts = [], ring = (t, rk) => { const pts = []; for (let i = 0; i <= 16; i++) pts.push(surf(h, t, -Math.PI / 2 + (i / 16) * Math.PI * 2, 1, 0.006 * rk)); return paint(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 24, 0.008, 4, true), 0, LAB.saddle.strap, q); };
  parts.push(ring(0.72, 1), ring(0.12, 1.3));
  for (const sx of [-1, 1]) parts.push(paint(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([surf(h, 0.14, 0.2, sx, 0.008), surf(h, 0.45, 0.1, sx, 0.008), surf(h, 0.72, -0.1, sx, 0.008)]), 8, 0.008, 4), 0, LAB.saddle.strap, q));
  return mergeGeometries(parts);
}
/** Хамгийн ойрын тоонд хоёр цэгийн хооронд ердийн хоолой (дэлгэрэнгүйд) */

/** Хормой: биеийн хажуугаас хэвлий, хөлийн дээд хэсгийг даган унжих урт үс; ирмэг нь шүдлэг (суурь = биеийн локал координат) */
function skirtGeo(d, NZ, NJ) {
  const { L, R, wide, p } = d.body, S = d.skirt, pos = [], idx = [];
  for (const sx of [1, -1]) {
    const base = pos.length / 3;
    for (let i = 0; i <= NZ; i++) {
      const t = -0.94 + 1.88 * i / NZ, f = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), p)), 1 / p), z = t * L / 2;
      const hem = -R * f - S.hair * Math.sqrt(f) + (i % 2 ? S.amp * f : 0);                // сондгой багана = шүдний үзүүр, сондгой = завсар
      const xk = wide * R * Math.cos(S.knee) * f + S.off * Math.min(1, f * 3), yk = R * Math.sin(S.knee) * f;
      for (let j = 0; j <= NJ; j++) {
        const u = j / NJ; let x, y;
        if (u <= 0.5) { const a = S.attach + (S.knee - S.attach) * (u / 0.5); x = wide * R * Math.cos(a) * f + (0.004 + (S.off - 0.004) * (u / 0.5)) * Math.min(1, f * 3); y = R * Math.sin(a) * f; }
        else { const q = (u - 0.5) / 0.5; x = xk + S.flare * q * f; y = yk + (hem - yk) * q; }
        pos.push(sx * x, y, z);
      }
    }
    for (let i = 0; i < NZ; i++) for (let j = 0; j < NJ; j++) {
      const a = base + i * (NJ + 1) + j, b = a + 1, c = a + (NJ + 1), e = c + 1;
      if (sx > 0) idx.push(a, c, b, b, c, e); else idx.push(a, b, c, b, e, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
/** Үхрийн биеийн нэмэлт: үнээ = дэлэн (бухын мөр нь bodyGeo crest); adult=false бол байхгүй */
function bodyExtraGeos(d, male, adult, q) {
  const R = d.body.R, out = [];
  if (adult && !male && d.udder) { const u = d.udder; out.push({ g: ellipsoid(u.r[0], u.r[1], u.r[2], [0, -R * u.y, u.z], q[0], q[1]), slot: 0, rgb: LAB.palette.udder }); }
  return out;
}
/** Сэмж: хүзүүний доор унжсан арьсан хавтан (хүзүүний локал координат) */
function dewlapGeo(d, w, h) {
  const k = d.neckLen / 0.26, e = d.dewlap;
  return ellipsoid(e.r[0], e.r[1], e.r[2] * k, [0, -e.y * d.neckR, e.z * k], w, h);
}
/** Урт сүүл: нарийн иш, үзүүртээ сэвсгэр (pivot = дээд) */
function cowTailGeo(d, seg, lite) {
  const T = d.tailLong, L = T.len;

  const lines = [], D_ = cur(), Lc = curLight();
  if (!ui.herd && ui.mode === 'cmp') for (const k of ['sheep', 'goat', 'cow', 'horse']) lines.push(`${{ sheep: 'Хонь', goat: 'Ямаа', cow: 'Үхэр', horse: 'Адуу' }[k]} дэлгэрэнгүй: <b>${DETS[k].parts.length}</b> mesh · <b>${fmt(DETS[k].tris)}</b> гурвалжин`);
  else if (!ui.herd && ui.mode !== 'light') lines.push(`Дэлгэрэнгүй: <b>${D_.parts.length}</b> mesh · <b>${fmt(D_.tris)}</b> гурвалжин`);
  if (!ui.herd && ui.species === 'horse') {   // өндөр: сэрвээ, эмээлийн суудал, дөрөө (насны хэмжээгээр)
    const d = D_.d, sc = ageScale(ui.age), gy = D_.sp.motion.fatY[0] + D_.sp.motion.fatY[1] * ui.fat, back = d.bodyY + d.body.R * gy;
    const I = D_.saddleInfo;
    lines.push(`Сэрвээ <b>${((back + (d.withers?.h ?? 0)) * sc).toFixed(2)}</b> м` + (I ? ` · эмээлийн суудал <b>${((back + I.seat) * sc).toFixed(2)}</b> м · дөрөө <b>${((back + I.stir) * sc).toFixed(2)}</b> м · тоглоомд малчны root = суудал − 0.86 = <b>${((back + I.seat) * sc - 0.86).toFixed(2)}</b> м` : ''));
  }
  if (ui.herd || ui.mode !== 'detail') {
    lines.push(`Хөнгөн: <b>${Lc.parts.length}</b> хэсэг (InstancedMesh) · <b>${Lc.tris}</b> гурвалжин / мал`);
    lines.push(`${Lc.parts.map((p) => `${p.name} ${triOf(p.geo) * p.mult}`).join(' · ')}`);
    if (ui.herd) {
      const cnt = {}; recs.forEach((r) => { cnt[r.sp] = (cnt[r.sp] || 0) + 1; });
      const tot = Object.entries(cnt).reduce((n, [k, v]) => n + v * LIGHTS[k].tris, 0);
      const dc = Object.keys(cnt).reduce((n, k) => n + LIGHTS[k].parts.length, 0);
      lines.push(`Мал: <b>${recs.length}</b> (${Object.entries(cnt).map(([k, v]) => ({ sheep: 'Хонь', goat: 'Ямаа', cow: 'Үхэр', horse: 'Адуу' }[k]) + ' ' + v).join(', ')}) · нийт <b>${fmt(tot)}</b> гурвалжин · draw call <b>${dc}</b>`);
    }
  }
  lines.push(`FPS: <b>${Math.round(fps)}</b>`);
  $('stats').innerHTML = lines.join('<br>');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const S of Object.values(DETS)) if (S.root.visible) poseAnimal(S, dt, { action: ui.action, age: ui.age, fat: ui.fat, blink: ui.blink });
  simulateLight(dt);
  controls.update();
  renderer.render(scene, camera);
  updateTags();
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if (t - lastStats > 0.5) { lastStats = t; updateStats(); }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
rebuildDetail(); genRecs(); frame();
$('loading').style.display = 'none';
window.__dbg = { camera, controls, ui, THREE, frame, genRecs, LAB, SPECIES, DETS, LIGHTS, get recs() { return recs; } };
animate();
</script>
</body>
