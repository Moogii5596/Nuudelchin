<script type="module">

/* =====================================================================

 * цилиндр толгой + нүүр, текстургүй цэвэр өнгө.
 * Хоёр түвшин:
 *   Дэлгэрэнгүй — canvas-ээр зурсан нүүр, олон mesh (ойрын зураг).
 *   Хөнгөн      — ≤ 750 гурвалжин, төрөл бүрт цөөн InstancedMesh (бие+сүүл · хүзүү · толгой+чих+нүд · 4 хөл), нэг материал,

const INK = '#22160f';
const css = (c) => '#' + c.toString(16).padStart(6, '0');
const mix = (a, b, k) => { const ch = (s) => Math.round(((a >> s) & 255) * (1 - k) + ((b >> s) & 255) * k) << s; return ch(16) | ch(8) | ch(0); };

const rnd = (a, b) => a + Math.random() * (b - a);

function profile(ctrl, rows) {

function ellipsoid(rx, ry, rz, pos = [0, 0, 0], w = 24, h = 16) {
  const g = new THREE.SphereGeometry(1, w, h);
  const p = g.attributes.position, n = g.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);

}
const rotZ = (g, a) => { g.applyMatrix4(new THREE.Matrix4().makeRotationZ(a)); return g; };
const mesh = (geo, mat, parent, x = 0, y = 0, z = 0) => {

function group(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const triOf = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;

/* ---------- Хонины хэсгүүд (дэлгэрэнгүй ба хөнгөн хоёулаа хэрэглэнэ; seg/rows параметртэй) ---------- */
/** Бие: нэг цэвэр торх (superellipse профайлтай lathe, урт нь z тэнхлэгт) */
function bodyGeo({ L, R, wide, p, sag = 0 }, seg = 44, rows = 44) {
  const pts = [];
  for (let i = 0; i <= rows; i++) {
    const t = -Math.cos(Math.PI * i / rows);       // үзүүр рүү нягт
    pts.push(new THREE.Vector2(R * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), p)), 1 / p), t * L / 2));
  }
  const g = new THREE.LatheGeometry(pts, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  const pos = g.attributes.position, an = [];
  for (let i = 0; i < pos.count; i++) {
    { // шинжилгээний гөлгөр нормал (superellipsoid-ийн градиент) — цөөн хуваалттай ч бөөрөнхий харагдана
      const X = pos.getX(i), Y = pos.getY(i), Z = pos.getZ(i), r = Math.hypot(X, Y) || 1e-6, a = r / R, u = Z / (L / 2);
      const k = Math.pow(a, p - 1) / R, nx = k * (X / r) / wide, ny = k * (Y / r), nz = Math.sign(u) * Math.pow(Math.abs(u), p - 1) / (L / 2);
      const m = Math.hypot(nx, ny, nz) || 1; an.push(nx / m, ny / m, nz / m);
    }
    pos.setX(i, pos.getX(i) * wide);
    if (sag) { const y = pos.getY(i), u = pos.getZ(i) / (L / 2); if (y > 0) pos.setY(i, y - sag * (1 - u * u) * (y / R)); }   // хөгшин: нуруу бага зэрэг хонхойно
  }

}
/** Хүзүү: богино бүдүүн хоолой (+z руу), урт нь len */
function neckGeo(len, seg = 24, rows = 5, rk = 1) {
  const k = len / 0.26, pts = [];
  const prof = [[0.12, -0.02], [0.125, 0.05], [0.104, 0.17], [0.082, 0.27]];
  const c = new THREE.SplineCurve(prof.map(([r, y]) => new THREE.Vector2(r * rk, y * k)));
  for (const p of c.getPoints(rows)) pts.push(p);
  const g = new THREE.LatheGeometry(pts, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  g.computeVertexNormals();
  return g;
}
/** Хормой: биеийн хажуугаас хэвлий, хөлийн дээд хэсгийг даган унжих урт үс; ирмэг нь шүдлэг (суурь = биеийн локал координат) */
function skirtGeo(d, NZ, NJ) {
  const { L, R, wide, p } = d.body, S = d.skirt, pos = [], idx = [];
  for (const sx of [1, -1]) {
    const base = pos.length / 3;
    for (let i = 0; i <= NZ; i++) {
      const t = -0.94 + 1.88 * i / NZ, f = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), p)), 1 / p), z = t * L / 2;
      const hem = -R * f - S.hair * Math.sqrt(f) + (i % 2 ? S.amp * f : 0);                // сондгой багана = шүдний үзүүр, сондгой = завсар
      const xk = wide * R * Math.cos(S.knee) * f + S.off * Math.min(1, f * 3), yk = R * Math.sin(S.knee) * f;
      for (let j = 0; j <= NJ; j++) {
        const u = j / NJ; let x, y;
        if (u <= 0.5) { const a = S.attach + (S.knee - S.attach) * (u / 0.5); x = wide * R * Math.cos(a) * f + (0.004 + (S.off - 0.004) * (u / 0.5)) * Math.min(1, f * 3); y = R * Math.sin(a) * f; }
        else { const q = (u - 0.5) / 0.5; x = xk + S.flare * q * f; y = yk + (hem - yk) * q; }
        pos.push(sx * x, y, z);
      }
    }
    for (let i = 0; i < NZ; i++) for (let j = 0; j < NJ; j++) {
      const a = base + i * (NJ + 1) + j, b = a + 1, c = a + (NJ + 1), e = c + 1;
      if (sx > 0) idx.push(a, c, b, b, c, e); else idx.push(a, b, c, b, e, c);

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;

/** Хөл: доошоо нарийссан; hoof=true бол үзүүрийн туурайг тусад нь slot-оор (хөнгөн) */
function legGeoDetail(len, r0, r1) {
  const pts = [[0, 0], [r0 * 0.92, -0.012], [r0, -0.04], [(r0 + r1) / 2 + 0.004, -len * 0.5], [r1, -len * 0.92], [r1 * 0.96, -len], [0, -len]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, 16); g.computeVertexNormals(); return g;
}
function hoofGeo(r, ys = 1) {
  const pts = [[0, 0.004], [r * 1.0, 0.0], [r * 1.12, -0.022 * ys], [r * 1.05, -0.05 * ys], [0, -0.052 * ys]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, 16); g.computeVertexNormals(); return g;
}
/** Өөхөн сүүл: өргөн хавтгайдуу хавтан, оройгоороо тулгууртай (pivot = дээд) */
function tailGeo({ w, h, d }, sw = 28, sh = 20) {
  const g = ellipsoid(w, h, d, [0, 0, 0], sw, sh);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = smooth01(0, -h, y);
    p.setXYZ(i, x * (1 - 0.22 * t), y - h, z * (1 - 0.12 * t) - d * 0.2);
  }
  return g;   // нормал нь ellipsoid-ийн шинжилгээний (гөлгөр) нормал хэвээр
}
/* ---------- Толгой: духан талдаа өргөн, хошуу руугаа нарийссан бөөрөнхий (урд тийш урт тэнхлэгтэй) ----------
 * Нүд, чих, хамар, ам нь жинхэнэ жижиг геометр (текстургүй): нүд = цайвар зууван + хар хүүхэн харааны диск,
 * чих = навч хэлбэртэй, хажуу тийш доош унжсан нимгэн хавтан (гадна тал толгойн өнгө, дотор тал ягаан саарал).
 * Бүх тоо нь sp.head (LAB-ийн доор) — hx: хажуу тийш нарийсалт, zb: эргэх цэг (уртын хувь). */
const FW = 2048, FH = 1024;                                       // малчны нүүрний canvas (жишиг малчинд)
const radAt = (h, t) => {
  const base = h.rn + (h.r - h.rn) * (1 - smooth01(0.28, 0.85, t));
  const cap = t < 0.12 ? Math.sqrt(Math.max(0, 1 - Math.pow(1 - t / 0.12, 2))) : 1;
  const capF = t > 0.84 ? Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.84) / 0.16, 2))) : 1;
  return base * cap * capF;
};
function headSkull(h, seg, rows) {
  const pts = [];
  for (let i = 0; i <= rows; i++) { const t = (1 - Math.cos(Math.PI * i / rows)) / 2; pts.push(new THREE.Vector2(radAt(h, t), t * h.L)); }
  const g = new THREE.LatheGeometry(pts, seg);
  g.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));    // y → z (урагш)
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) * h.hx, z = p.getZ(i); let y = p.getY(i);
    if (h.bridge && y > 0) y += h.bridge * Math.sin(Math.PI * Math.min(1, Math.max(0, (z / h.L - 0.3) / 0.6))) * Math.min(1, y / (h.r * 0.5));
    p.setXYZ(i, x, y, z - h.zb * h.L);

}
const surf = (h, t, phi, sx, out = 0) => {
  const r = radAt(h, t) + out;
  return new THREE.Vector3(sx * Math.cos(phi) * r * h.hx, Math.sin(phi) * r, t * h.L - h.zb * h.L);
};
/** Өнгө: headC өгвөл (дэлгэрэнгүй) оройн өнгөнд шууд шингээнэ; үгүй бол (хөнгөн) slot 1 = instanceColor-оор үржинэ, slot 0 = тогтмол */
function paint(g, slot, rgb, headC) {
  g.deleteAttribute('uv');
  const n = g.attributes.position.count, c = new THREE.Color(rgb), col = new Float32Array(n * 3), sl = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    if (headC) { const cc = slot ? headC : c; col.set([cc.r, cc.g, cc.b], i * 3); }
    else if (slot) { col.set([1, 1, 1], i * 3); sl[i] = 1; }
    else col.set([c.r, c.g, c.b], i * 3);

}
function paintSkull(g, h, headC) {
  paint(g, 1, 0xffffff, headC);
  const p = g.attributes.position, col = g.attributes.color, sl = g.attributes.aSlot, tip = new THREE.Color(h.tip ?? LAB.palette.muzzleTip);
  for (let i = 0; i < p.count; i++) {
    const w = smooth01(0.72, 0.95, (p.getZ(i) + h.zb * h.L) / h.L);       // хошууны үзүүр цайвар саарал
    if (headC) col.setXYZ(i, headC.r + (tip.r - headC.r) * w, headC.g + (tip.g - headC.g) * w, headC.b + (tip.b - headC.b) * w);
    else { sl.setX(i, 1 - w); col.setXYZ(i, 1 + w * (tip.r - 1), 1 + w * (tip.g - 1), 1 + w * (tip.b - 1)); }

/** Эвэр: хойш муруйсан, үзүүр рүүгээ нарийсах хоолой (толгойн дээд хэсгээс; k = урт/өсөлтийн коэффициент) */
function hornGeo(h, sx, k, q) {
  const H = h.horn, len = H.len * k, root = surf(h, H.t, H.phi, sx, -0.012);
  const P = H.pts.map(([x, y, z]) => new THREE.Vector3(sx * x * len, y * len, z * len).add(root));
  const curve = new THREE.CatmullRomCurve3(P), n = q.horn[0], rad = q.horn[1], fr = curve.computeFrenetFrames(n, false);

    for (let j = 0; j < rad; j++) { const a = j / rad * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a); pos.push(c.x + (N.x * ca + B.x * sa) * r, c.y + (N.y * ca + B.y * sa) * r, c.z + (N.z * ca + B.z * sa) * r); }

  for (let i = 0; i < n; i++) for (let j = 0; j < rad; j++) {

/** Сахал: эрүүний доор доошоо нарийсах дусал */
function beardGeo(h, q) {

  for (let i = 0; i < pp.count; i++) { const t = smooth01(0.2, 1, -pp.getY(i) / b.len), f = 1 - 0.5 * t; pp.setX(i, pp.getX(i) * f); pp.setZ(i, pp.getZ(i) * f); }

/** Толгойн бүх хэсэг (толгойн локал координатад); q = нарийвчлал; o = {hornK} */
function makeHead(h, q, headC, o = {}) {
  const P = LAB.palette;
  const out = { skull: paintSkull(headSkull(h, q.seg, q.rows), h, headC), details: [], eyes: [], ears: [] };
  const M = new THREE.Matrix4(), M2 = new THREE.Matrix4();

    const phi = 0.38, pos = surf(h, h.eyeT, phi, sx, 0.0015), pk = h.pupil || [0.55, 0.7];
    M.makeRotationZ(sx * phi).multiply(M2.makeRotationY(sx * Math.PI / 2));
    const nrm = new THREE.Vector3(sx * Math.cos(phi), Math.sin(phi), 0);
    const cream = new THREE.CircleGeometry(1, q.eyeSeg); cream.scale(h.ea, h.eb, 1); cream.applyMatrix4(M);
    const pupil = new THREE.CircleGeometry(1, q.eyeSeg); pupil.scale(h.ea * pk[0], h.eb * pk[1], 1); pupil.applyMatrix4(M);
    pupil.translate(nrm.x * 0.002, nrm.y * 0.002, h.ea * (h.pupilFwd ?? 0.22));
    out.eyes.push({ sx, pos, cream: paint(cream, 0, h.eyeC ?? P.eyeWhite, headC), pupil: paint(pupil, 0, P.eyeInk, headC) });
    // хамрын нүх
    const nz = (1 - h.zb) * h.L - 0.0025, nose = new THREE.CircleGeometry(1, q.noseSeg);
    nose.scale(h.rn * 0.18, h.rn * 0.12, 1); nose.applyMatrix4(M2.makeRotationY(sx * 0.35)); nose.translate(sx * h.rn * 0.32, h.rn * 0.16, nz);
    out.details.push(paint(nose, 0, P.nose, headC));

/* ---------- Хөдөлгөөн (rig-д; хоёр түвшинд нийтлэг) ---------- */

  frame();
  const c = ui.species === 'goat' ? [0.78, 0.9, 0] : [0.7, 0.5, 0];
  const off = { side: [0, 0.05, 1.05], obl: [0.75, 0.28, 0.95], front: [1.1, 0.05, 0] }[kind], tg = kind === 'side' ? c : [c[0], c[1] - 0.05, 0];
  controls.minDistance = 0.3; herder.visible = false;
  controls.target.set(...tg); camera.position.set(c[0] + off[0], c[1] + off[1], c[2] + off[2]); controls.update();
}
window.headCam = headCam;
for (const [l, k] of [['Хажуу ойроос', 'side'], ['Ташуу ойроос', 'obl'], ['Урдаас', 'front']]) mk($('gHead'), l, () => headCam(k));
for (const [k, sp] of [['sheep', 'Хонь'], ['goat', 'Ямаа']]) btns.species[k] = mk($('gSpecies'), sp, () => { ui.species = k; if (ui.action === 'browse' && k !== 'goat') ui.action = 'graze'; fillVariants(); genRecs(); frame(); });
const sexSel = document.createElement('select'); sexSel.innerHTML = '<option value="m">Эр (урт эвэр)</option><option value="f">Эм (богино эвэр)</option>';
sexSel.onchange = () => { ui.male = sexSel.value === 'm'; rebuildDetail('goat'); genRecs(); frame(); };
$('gGoat').appendChild(sexSel);
function fillVariants() {
  const sp = SPECIES[ui.species], v = $('variant'); v.innerHTML = '';
  sp.variants.forEach((x, i) => { const o = document.createElement('option'); o.value = i; o.textContent = x.n; v.appendChild(o); });
  v.value = ui.variant;
  [...$('age').options].forEach((o, i) => { o.textContent = sp.ageNames[i]; });
}
fillVariants();
$('age').onchange = (e) => { ui.age = +e.target.value; rebuildDetail(); frame(); };
$('fat').oninput = (e) => { ui.fat = +e.target.value / 100; $('fatV').textContent = e.target.value + '%'; };
$('variant').onchange = (e) => { ui.variant = +e.target.value; rebuildDetail(); frame(); };
$('blinkOn').onchange = (e) => { ui.blink = e.target.checked; };

const tagDivs = {};
for (const k of ['detail', 'light']) { const d = document.createElement('div'); d.className = 'tag'; d.textContent = k === 'detail' ? 'Дэлгэрэнгүй' : 'Хөнгөн'; $('tags').appendChild(d); tagDivs[k] = d; }
const v3 = new THREE.Vector3();
function updateTags() {
  for (const [k, x] of [['detail', 0], ['light', 1.5]]) {
    const div = tagDivs[k]; div.style.display = ui.mode === 'both' && !ui.herd ? '' : 'none';
    v3.set(x, 1.1, 0).project(camera);
    div.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px'; div.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
  }
}
let fps = 60, lastStats = 0;
const fmt = (n) => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
function updateStats() {
  const lines = [], D_ = cur(), Lc = curLight();
  if (!ui.herd && ui.mode === 'cmp') for (const k of ['sheep', 'goat']) lines.push(`${k === 'goat' ? 'Ямаа' : 'Хонь'} дэлгэрэнгүй: <b>${DETS[k].parts.length}</b> mesh · <b>${fmt(DETS[k].tris)}</b> гурвалжин`);
  else if (!ui.herd && ui.mode !== 'light') lines.push(`Дэлгэрэнгүй: <b>${D_.parts.length}</b> mesh · <b>${fmt(D_.tris)}</b> гурвалжин`);
  if (ui.herd || ui.mode !== 'detail') {
    lines.push(`Хөнгөн: <b>${Lc.parts.length}</b> хэсэг (InstancedMesh) · <b>${Lc.tris}</b> гурвалжин / мал`);
    lines.push(`${Lc.parts.map((p) => `${p.name} ${triOf(p.geo) * p.mult}`).join(' · ')}`);
    if (ui.herd) {
      const cnt = {}; recs.forEach((r) => { cnt[r.sp] = (cnt[r.sp] || 0) + 1; });
      const tot = Object.entries(cnt).reduce((n, [k, v]) => n + v * LIGHTS[k].tris, 0);
      const dc = Object.keys(cnt).reduce((n, k) => n + LIGHTS[k].parts.length, 0);
      lines.push(`Мал: <b>${recs.length}</b> (${Object.entries(cnt).map(([k, v]) => (k === 'goat' ? 'Ямаа' : 'Хонь') + ' ' + v).join(', ')}) · нийт <b>${fmt(tot)}</b> гурвалжин · draw call <b>${dc}</b>`);
    }
  }
  lines.push(`FPS: <b>${Math.round(fps)}</b>`);
  $('stats').innerHTML = lines.join('<br>');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const S of Object.values(DETS)) if (S.root.visible) poseAnimal(S, dt, { action: ui.action, age: ui.age, fat: ui.fat, blink: ui.blink });
  simulateLight(dt);
  controls.update();
  renderer.render(scene, camera);
  updateTags();
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if (t - lastStats > 0.5) { lastStats = t; updateStats(); }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
rebuildDetail(); genRecs(); frame();
$('loading').style.display = 'none';
window.__dbg = { camera, controls, ui, THREE, frame, genRecs, LAB, SPECIES, DETS, LIGHTS, get recs() { return recs; } };
animate();
</script>
</body>
</html>
